{% extends "base.html" %}

{% block title %}Login — SecureVault{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Enter your credentials to access your secure vault.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" class="form-control" placeholder="user@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-input-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required>
                    <button type="button" class="toggle-password" data-target="password">Show</button>
                </div>
            </div>

            <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-muted); cursor: pointer;">
                    <input type="checkbox" name="remember" style="accent-color: var(--primary);"> Remember me
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
