{% extends "base.html" %}
{% block title %}413 Payload Too Large — SecureVault{% endblock %}
{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
    <h1 style="font-size: 5rem; color: var(--danger); margin-bottom: 0.5rem;">413</h1>
    <h2 style="margin-bottom: 1rem;">File Size Limit Exceeded</h2>
    <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem;">The uploaded file exceeds the maximum allowable limit of 50 MB.</p>
    <a href="{{ url_for('main.encrypt_page') }}" class="btn btn-primary">Try Smaller File</a>
</div>
{% endblock %}
