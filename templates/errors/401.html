{% extends "base.html" %}
{% block title %}401 Unauthorized — SecureVault{% endblock %}
{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
    <h1 style="font-size: 5rem; color: var(--warning); margin-bottom: 0.5rem;">401</h1>
    <h2 style="margin-bottom: 1rem;">Authentication Required</h2>
    <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem;">You must be logged in to view this resource.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Sign In</a>
</div>
{% endblock %}
