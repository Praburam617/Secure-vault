{% extends "base.html" %}

{% block title %}404 Page Not Found — SecureVault{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
    <h1 style="font-size: 5rem; font-family: var(--font-heading); color: var(--primary); margin-bottom: 0.5rem;">404</h1>
    <h2 style="margin-bottom: 1rem;">Page or Resource Not Found</h2>
    <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem;">
        The requested URL was not found on this server. It may have been moved, deleted, or never existed.
    </p>
    <a href="{{ url_for('main.landing') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
